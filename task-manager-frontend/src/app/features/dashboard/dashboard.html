<div class="dashboard">

  <h1>Dashboard</h1>

  <div class="cards">

    <div class="card">
      <h3>Total tareas</h3>
      <p>{{ totalTasks }}</p>
    </div>

    <div class="card">
      <h3>Pendientes</h3>
      <p>{{ pendingTasks }}</p>
    </div>

    <div class="card">
      <h3>Completadas</h3>
      <p>{{ completedTasks }}</p>
    </div>

    <div class="card">
      <h3>Tareas creadas</h3>
      <p>{{ createdTasks }}</p>
    </div>

  </div>

</div>
